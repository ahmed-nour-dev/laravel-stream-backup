name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        stability: [prefer-stable]
        include:
          - laravel: '10.*'
            testbench: '8.*'
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          - php: '8.1'
            laravel: '11.*'
          - php: '8.1'
            laravel: '12.*'
          - php: '8.1'
            laravel: '13.*'
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: stream_backup_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Consumed by the MySQL-gated feature tests (RestoreRollbackTest,
      # RestoreLargeScaleIntegrationTest, StreamPipelineSmokeTest,
      # RestorePipelineFailureModesTest) to exercise the shadow-table
      # rollback, FK dependency ordering, and the selective-restore
      # FK-boundary guard against a real MySQL server instead of skipping.
      STREAM_BACKUP_TEST_HOST: 127.0.0.1
      STREAM_BACKUP_TEST_PORT: 3306
      STREAM_BACKUP_TEST_USER: root
      STREAM_BACKUP_TEST_PASSWORD: root
      STREAM_BACKUP_TEST_DATABASE: stream_backup_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pigz mysql-client

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pcntl, hash, mbstring, pdo, pdo_sqlite, sqlite3, pdo_mysql, mysqli, intl, bcmath
          coverage: none
          tools: composer:v2

      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent && break
            sleep 2
          done
          mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ matrix.stability }}-

      - name: Install dependencies
        run: |
          composer require --dev "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Lint PHP sources
        run: |
          find src -name "*.php" -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Execute PHPUnit tests
        run: vendor/bin/phpunit --testsuite Unit,Feature --colors=always
